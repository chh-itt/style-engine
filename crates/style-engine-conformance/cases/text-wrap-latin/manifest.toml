# Latin 单 run 折行（第五批③建 xfail 资产，第五批㉔转正）：①normal 行高
# 度量差已由㉔修复（round(asc)+round(desc) 不含 lineGap：Chromium 64 =
# 引擎 64，原 65 vs 64）；②文本叶不拉伸（198 vs 220）已由⑥文本叶契约
# 消除。断行点两侧一致（4 行=4 行、词边界同断）；字形两侧同源
# （DejaVuSans.ttf 经 @font-face ∥ add_font）。
viewport = [800.0, 600.0]
scale = 1.0
fonts = ["DejaVu Sans=crates/style-engine-demo/assets/fonts/DejaVuSans.ttf"]
features = ["text-wrap", "fonts", "line-height-normal"]
xfail = false
tolerance = 0.5

# calc() 布局直通用例（第五批⑤建、二期①转正）：.a 纯长度 calc 两侧一致；
# .b 含百分比 calc——二期①结算式直通（layout.rs DeferredRaw 捕获 +
# engine.rs settle_calc，以父内容尺寸 780px 为基准）后引擎与 Chromium
# 原生求值一致（400px），xfail 转正（T0 零容忍首个消除项）。
viewport = [800.0, 600.0]
scale = 1.0
fonts = []
features = ["calc", "calc-percent", "background-color"]
xfail = false
tolerance = 0.5

# Pixel 通道（二期④）：同 case 驱动 Numeric+Pixel 一致性——引擎软 Sink
# 渲染 vs Chromium 截图；全整数矩形（150×30/400×30、#222222 底），差异
# 应为精确或零星 AA 边缘。
[pixel]
max_ratio = 0.001
allowed = [1, 2]

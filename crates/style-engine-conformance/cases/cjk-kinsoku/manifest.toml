# CJK 混排断行 xfail 哨兵（第四批⑥）：窄容器（140px）内 CJK+Latin 混排
# 文本，两侧同源 Noto Sans SC（dumper @font-face 注入 / 引擎 add_font）。
# 钉死「现状不可达 Chromium 一致性」的差异（实测）：①文本叶不拉伸至包含
# 块宽（引擎 131 vs 浏览器 140——文本叶尺寸=实测语义）；②normal 行高度
# 量（引擎 23.25px vs 浏览器 24px——度量来源/取整差异，4 行总高 93 vs 96）。
# 断行选择本身在此探针上两侧一致（标准禁则经 UAX#14 已覆盖）；自定义
# 禁则不可达属上游限制（parley LineBreakOverrideFn 仅 ASCII，见
# DEPENDENCIES）。引擎文本度量修复后转正重生成预算。
viewport = [800.0, 600.0]
scale = 1.0
fonts = ["Noto Sans SC=crates/style-engine-demo/assets/fonts/NotoSansSC.ttf"]
features = ["text-wrap", "cjk", "line-height-normal"]
xfail = true
tolerance = 0.5

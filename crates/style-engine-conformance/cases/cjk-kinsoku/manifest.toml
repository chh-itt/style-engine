# CJK 混排断行（第四批⑥建 xfail 哨兵，第五批㉔转正）：窄容器（140px）内
# CJK+Latin 混排文本，两侧同源 Noto Sans SC（dumper @font-face 注入 /
# 引擎 add_font）。㉔ normal 行高度量 Chromium 对齐（round(asc)+round(desc)
# 不含 lineGap/leading）落地后逐盒一致（4 行总高 96=96），原 93 vs 96 与
# 文本叶不拉伸（131 vs 140，⑥ 契约消除）两差异均闭环。断行选择两侧一致
# （标准禁则经 UAX#14 已覆盖）；自定义禁则不可达属上游限制（parley
# LineBreakOverrideFn 仅 ASCII，见 DEPENDENCIES）。
viewport = [800.0, 600.0]
scale = 1.0
fonts = ["Noto Sans SC=crates/style-engine-demo/assets/fonts/NotoSansSC.ttf"]
features = ["text-wrap", "cjk", "line-height-normal"]
xfail = false
tolerance = 0.5

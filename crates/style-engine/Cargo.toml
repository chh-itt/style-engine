[package]
name = "style-engine"
description = "Framework-agnostic CSS semantic styling for native GUIs: parse, cascade, lay out, and emit a paint-ready display list."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cssparser = { workspace = true }
cssparser-sel = { workspace = true }
precomputed-hash = { workspace = true }
selectors = { workspace = true }
peniko = { workspace = true }
slotmap = { workspace = true }
bitflags = { workspace = true }
smallvec = { workspace = true }
tracing = { workspace = true }
# C2 capitalize（css-text-4）：UAX#29 词界分词——纯 Rust、MIT/Apache-2.0、
# 零传递依赖。
unicode-segmentation = "1"
taffy = { workspace = true, optional = true }
parley = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = ["layout", "text"]
layout = ["dep:taffy"]
text = ["dep:parley"]
serde = ["dep:serde"]

[dev-dependencies]
# 差分测试基座（实施期 Phase 0 前置⑥）：增量链 ≡ 全量重建等价。
# 仅 dev-dep——C4 纪律：proptest 不进主依赖树。
proptest = "1.11"
# F3a2（ADR-0023）serde 往返锁：JSON 通道真格式验证（仅 dev-dep）。
serde_json = "1"

[lints]
workspace = true

[workspace]
resolver = "2"
members = [
    "crates/style-engine",
    "crates/style-engine-vello",
    "crates/style-engine-soft",
    "crates/style-engine-tiny",
    "crates/style-engine-demo",
    "crates/style-engine-conformance",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
# 1.85（edition 2024 起点）→ 1.90：依赖地板上调——ordered-float 5.5.0 需
# 1.90、smol_str 0.3.6 需 1.89、vello 0.11 链需 1.89（parley/fontique 需
# 1.88；CI msrv 实测 2026-10；MSRV 以依赖最高者为准，见 docs/DEPENDENCIES.md）。
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/chh-itt/style-engine"

[workspace.lints.rust]
# 阶段3：forbid → deny——唯一豁免点 = style-engine SendSyncTaffy（taffy
# 0.14 CompactLength nan-boxing 非 Send/Sync 的包装，SAFETY 论证见该类型
# 文档）；其余任何 unsafe 仍直接编译失败。
unsafe_code = "deny"

[workspace.dependencies]
# --- CSS 语法层（servo 系，ADR-0004） ---
cssparser = "0.38.0"
# selectors 0.40 与 cssparser 0.37 配对（0.38 起解析器改为单生命周期，
# 两者无法共享类型）；cssparser-sel 仅服务 selector.rs 内部的解析/匹配，
# 与解析层的 cssparser 0.38 不产生类型交集（见 docs/DEPENDENCIES.md）。
cssparser-sel = { package = "cssparser", version = "0.37.0" }
precomputed-hash = "0.1.1"
selectors = "0.40.0"

# --- linebender 绘制词汇表与渲染栈（ADR-0001/0002） ---
peniko = "0.6.1"
taffy = "0.14.0"
# complex-scripts（parley#621）：CJ/SEA 词典级词分段；cjdict 已随
# icu_segmenter_data baked（≈+2MiB 数据段）。CJK 行断行仍走 UAX#14
# （icu_segmenter 2.x 行分段器有意不加载 CJ 词典——设计取舍，见 DEPENDENCIES）。
parley = { version = "0.11.1", features = ["complex-scripts"] }
# P9-8（2026-10-08）：0.10→0.11 已执行——0.11.0（2026-10-02）唯一 breaking=
# wgpu/naga 升 30（#1909），Scene/Renderer/peniko/kurbo 使用面零变化；
# peniko 维持 ^0.6.1（0.11 代仍配 0.6.x）、parley 已在 0.11.1。
vello = "0.11.0"

# --- 宿主侧（仅 demo/sink，核心 crate 禁止，ADR-0001） ---
# wgpu 必须跟随 vello 的锁定走（vello 0.11 = ^30）——版本配对铁律见 docs/DEPENDENCIES.md。
wgpu = "30.0.1"
winit = "=0.31.0-beta.3"
# P10（style-engine-tiny）：CPU 后端——tiny-skia 0.12（BSD-3，resvg 同款
# 光栅器）+ skrifa 0.44（字形轮廓）。均已在 deny.toml 许可白名单内。
tiny-skia = "0.12"
skrifa = "0.44"

# --- 基础设施 ---
slotmap = "1.1.1"
bitflags = "2.13.2"
# --- conformance harness（ADR-0003 双通道；仅 harness crate 使用） ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
smallvec = "1"
tracing = "0.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - name: clippy（短格式，全特性，警告即错）
        run: cargo clippy --workspace --all-features --message-format short -- -D warnings
      # 含 Numeric Channel（golden 已入库，仅对比无需浏览器）；
      # golden 重生成属本地 Playwright 步骤（tools/dump_rects.py），不入 CI。
      - run: cargo test --workspace --all-features
      # 特性幂集守卫：当前各 crate 无自定义特性（default/no-default 同形），
      # 预防未来新增特性面漏检。
      - run: cargo hack check --workspace --feature-powerset --no-dev-deps
      # LFS（路线图㉗：建仓启用 git-lfs 收 *.ttf/*.otf/*.woff2 后取消注释）
      # - run: git lfs install && git lfs pull

  msrv:
    # MSRV 底线：workspace rust-version = 1.85（edition 2024 起点）。
    # 若依赖链（linebender/wgpu 一代）抬高于此，以实际失败为准上调并同步 DEPENDENCIES。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --workspace --all-features
      - run: cargo test --workspace --all-features

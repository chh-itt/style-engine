name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    # 三平台矩阵：test 全平台跑；fmt/clippy/cargo-hack 幂集仅 ubuntu
    # （lint 类检查平台无关，省分钟数）。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Linux：fontique 系统字体发现走 fontconfig（yeslogic-fontconfig-sys
      # build script 需 pkg-config + libfontconfig1-dev，runner 默认缺）。
      - name: Install fontconfig dev (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev
      # windows CI 虚拟适配器不稳（wgpu 设备创建 0xc0000005，无法进程内
      # 捕获）——vello GPU 探针测试读取此变量短路跳过；ubuntu/macOS 不设。
      - name: Skip GPU probe on windows CI
        if: matrix.os == 'windows-latest'
        run: Add-Content $env:GITHUB_ENV "STYLE_ENGINE_NO_GPU_PROBE=1"
      - name: Install cargo-hack
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - name: Install cargo-deny
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
        if: matrix.os == 'ubuntu-latest'
      - name: clippy（短格式，全特性，警告即错）
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-features --message-format short -- -D warnings
      # sink 忽略卫生门禁（块 A，docs/SINK-MATRIX.md）：soft/vello 源码
      # 禁止静默忽略（let _ = / 假绑定 / .ok() 丢弃）——parity 无断层。
      - name: sink ignore hygiene
        if: matrix.os == 'ubuntu-latest'
        run: python3 crates/style-engine-conformance/tools/check_sink_ignores.py
      # 含 Numeric/Pixel Channel（golden 已入库，仅对比+软渲染，无需浏览器）；
      # golden 重生成属本地 Playwright 步骤（tools/dump_rects.py），不入 CI。
      # --locked：CI 一律按入库 Cargo.lock 解析（三期 Stage 4 锁定版本策略）。
      - run: cargo test --workspace --all-features --locked
      # 特性幂集守卫：default/no-default/layout/text 组合全编译。
      # --no-dev-deps 会在运行期剥离 dev-dependencies 改变依赖图，与 --locked
      # 冲突（cargo 要求重写 Cargo.lock 被拒）——此处不加 --locked；lock 完整性
      # 由 fmt/clippy/test 三步的 --locked 与 msrv/perf-gate 保证。
      - run: cargo hack check --workspace --feature-powerset --no-dev-deps
        if: matrix.os == 'ubuntu-latest'
      # 依赖供应链门禁（阶段4）：licenses 硬门 + RustSec advisories +
      # 重复版本 bans（deny.toml；审计记录 docs/DEPENDENCIES.md）。
      - run: cargo deny check
        if: matrix.os == 'ubuntu-latest'
      # LFS（路线图㉗：建仓启用 git-lfs 收 *.ttf/*.otf/*.woff2 后取消注释）
      # - run: git lfs install && git lfs pull

  msrv:
    # MSRV 底线：workspace rust-version = 1.90（edition 2024 起点 1.85，被
    # 依赖地板抬升——ordered-float 5.5.0 需 1.90、smol_str 0.3.6 需 1.89、
    # vello/parley/fontique 链需 1.88；2026-10 CI 实测上调，记录
    # docs/DEPENDENCIES.md）。依赖链再抬高时以实际失败为准上调并同步。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - name: Install fontconfig dev (Linux)
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --workspace --all-features --locked
      - run: cargo test --workspace --all-features --locked

  perf-gate:
    # 性能预算门禁（阶段5/C5）：四场景阈值断言（box_1k 5.0 / incr 2.0 /
    # text_50 8.0 / scroll 3.0 ms，推导与实测见 docs/PERFORMANCE.md）。
    # 阈值与实测 p95 间余量 ≥2.7×，吸收 runner 机型波动；debug 下断言自动跳过，
    # 必须以 release 运行。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install fontconfig dev (Linux)
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: perf
      - run: cargo run --release --locked -p style-engine --example perf_gate

  golden-drift:
    # 黄金标准漂移门禁（块 A）：CI 里以钉死版本的 Playwright Chromium 重放
    # 重生成全部 golden，git diff 判漂移——防「本地重生成、仓库滞旧」静默
    # 偏差。playwright 版本与本地重生成环境一致（1.63.0，chromium 内嵌版
    # 随 playwright 钉死 → golden browser_version 确定性一致）。
    # 平台必须与 golden 重生成环境一致（Windows）：文本用例的字符步进与
    # 字形栅格化绑定平台文本栈——linux fontconfig 提示把步进整数量化
    # （实测 203.125→202、42.390625→43，最大差 1.125px 超出 numeric 0.5px
    # 容差），PNG 字形 AA 亦逐字节不同；字节等价检查只能钉单一平台，
    # 引擎侧跨平台一致性由 numeric/pixel 通道的容差预算保证。
    # 重生成协议 = 本地（Windows）重跑 tools/dump_rects.py 并提交。
    # 两级门禁：numeric.json（与 pixel.png 以外的一切）字节等价硬门；
    # pixel.png 不做字节门禁——Chromium 截图的字形 AA 风味绑定机器
    # （DirectWrite 字体平滑设置），几何全同（numeric 全一致，run 27 实测）
    # 时仍逐字节不同（table-basic/text-pixel 两例）。PNG 基线的语义保护 =
    # gate job 的 pixel.rs 预算对比（引擎输出 vs 入库 PNG，Class 预算吸收
    # AA 差异）；重生成仅在渲染相关变更落地时按协议本地执行。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install playwright==1.63.0
      - run: playwright install chromium
      - run: python crates/style-engine-conformance/tools/dump_rects.py
      # 显式钉行尾归一（windows 镜像默认值可能变动）：dump 以文本模式写
      # CRLF，autocrlf=true 时 clean 过滤归一 LF 后与索引逐字节相等。
      - name: Pin line-ending normalization
        run: git config core.autocrlf true
      - name: Fail on golden drift
        shell: bash
        run: |
          drift=$(git diff --name-only -- crates/style-engine-conformance/cases | grep -v 'pixel\.png$' || true)
          if [ -n "$drift" ]; then
            echo "::error::golden 漂移（numeric 字节等价硬门）："
            echo "$drift"
            echo "::error::本地重跑 tools/dump_rects.py 并提交（协议见本文件注释）"
            exit 1
          fi
          png=$(git diff --name-only -- crates/style-engine-conformance/cases | grep 'pixel\.png$' || true)
          if [ -n "$png" ]; then
            echo "pixel.png 字节差异（AA 风味，非门禁项；恢复入库版）："
            echo "$png"
            git checkout -- $png
          fi
